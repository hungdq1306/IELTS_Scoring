services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fogwrite
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: fogwrite_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogwrite -d fogwrite_test"]
      interval: 2s
      timeout: 2s
      retries: 15
