name: FogWrite pilot checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fogwrite
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: fogwrite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fogwrite -d fogwrite_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://fogwrite:ci_test_only@127.0.0.1:5432/fogwrite_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests -m "not live"
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t fogwrite-pilot .
