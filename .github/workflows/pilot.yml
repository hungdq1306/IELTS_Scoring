name: FogWrite pilot checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fogwrite
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: fogwrite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fogwrite -d fogwrite_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://fogwrite:ci_test_only@127.0.0.1:5432/fogwrite_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests -m "not live"
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://fogwrite:ci_test_only@127.0.0.1:5432/fogwrite_test
      - run: python -m alembic -c backend/alembic.ini upgrade head --sql
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://fogwrite:ci_test_only@127.0.0.1:5432/fogwrite_test
  task1-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r benchmarks/task1_extraction/requirements.txt
      - run: python -m pytest -q benchmarks/task1_extraction/test_pipeline.py
      - run: python -m unittest discover -s benchmarks/task1_extraction -t . -p "test_*.py"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix frontend --workspaces=false
      - run: npm --prefix frontend run typecheck:tour
      - run: node scripts/build-frontend.cjs
      - run: node --test scripts/fogwrite-model.test.mjs scripts/fogwrite-ui.test.cjs
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: node scripts/fogwrite-auth.test.cjs
      - run: node scripts/fogwrite-recovery.test.cjs
      - run: node scripts/fogwrite-guide.test.cjs
      - run: node scripts/fogwrite-tour.test.cjs
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t fogwrite-pilot .
