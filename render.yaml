services:
  - type: web
    name: fogwrite-pilot
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DATA_POLICY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_PRACTICE_ANSWER_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MAX_RPM
        value: 5
      - key: GEMINI_MAX_RPD
        value: 200
      - key: ENABLE_PRACTICE_GEN
        value: true
